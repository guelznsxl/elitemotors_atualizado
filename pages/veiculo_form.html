<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{% if veiculo %}Editar{% else %}Novo{% endif %} veículo - Elite Motors</title><link rel="stylesheet" href="{{ url_for('arquivo_css', filename='style.css') }}"></head><body><header><div class="logo">ELITE <span>MOTORS</span></div><nav><a href="{{ url_for('main.inicio') }}">Início</a><a href="{{ url_for('admin.painel') }}">Painel</a></nav></header><main class="page"><p class="tag">ESTOQUE</p><h1>{% if veiculo %}Editar veículo{% else %}Cadastrar veículo{% endif %}</h1>{% with mensagens = get_flashed_messages(with_categories=true) %}{% for categoria, mensagem in mensagens %}<div class="alert {{ categoria }}">{{ mensagem }}</div>{% endfor %}{% endwith %}<form class="form" method="post"><label>Marca</label><input name="marca" required value="{{ veiculo.marca if veiculo else '' }}"><label>Modelo</label><input name="modelo" required value="{{ veiculo.modelo if veiculo else '' }}"><label>Ano</label><input name="ano" type="number" min="1900" max="2100" required value="{{ veiculo.ano if veiculo else '' }}"><label>Quilometragem</label><input name="quilometragem" type="number" min="0" required value="{{ veiculo.quilometragem if veiculo else 0 }}"><label>Preço (R$)</label><input name="preco" type="number" min="0" step="0.01" required value="{{ veiculo.preco if veiculo else '' }}"><label>Câmbio</label><select name="cambio"><option>Automático</option><option {% if veiculo and veiculo.cambio == 'Manual' %}selected{% endif %}>Manual</option></select><label>Status</label><select name="status"><option>Disponível</option><option {% if veiculo and veiculo.status == 'Reservado' %}selected{% endif %}>Reservado</option><option {% if veiculo and veiculo.status == 'Vendido' %}selected{% endif %}>Vendido</option></select><label>URL da imagem</label><input name="imagem" type="url" value="{{ veiculo.imagem if veiculo else '' }}"><label>Descrição</label><textarea name="descricao">{{ veiculo.descricao if veiculo else '' }}</textarea><button class="btn" type="submit">Salvar veículo</button> <a href="{{ url_for('admin.painel') }}">Cancelar</a></form></main><footer><div class="logo">ELITE <span>MOTORS</span></div></footer></body></html>
